[package]
name = "remaph"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "remaph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

interception = "0.1.2"

base64 = "0.22"

# Control de volumen por sesión de audio (alcance "En App" de la
# Acción Multimedia) — ver back_multimedia.rs.
winmix = "0.1"

# Lectura/escritura del portapapeles de Windows (texto e imagen) sin
# manejar a mano los formatos crudos — usado por el tipo
# "portapapeles" (etapas D/E en adelante, ver back_portapapeles_captura.rs
# / back_portapapeles.rs). La DETECCIÓN de cambios sigue el mismo
# camino que ya usa back_app.rs::iniciar_monitor() (hilo dedicado +
# AddClipboardFormatListener vía windows-sys, ya es dependencia) —
# arboard solo se usa para LEER/ESCRIBIR el contenido una vez avisado
# el cambio, no para detectarlo.
arboard = "3"

# Selector nativo de Windows (archivo/carpeta) para el tipo "Abrir
# Archivo/App" — botón "Seleccionar..." y "Examinar..." dentro de
# "Abrir con" (filtrado a .exe). Ver comandos.rs::seleccionar_archivo()
# / seleccionar_carpeta().
rfd = "0.15"

# Lectura del registro de Windows para el listado de "Abrir con" del
# tipo "Abrir Archivo/App" (Etapa 7B) — programas recientes por
# extensión (HKCU\...\FileExts\<ext>\OpenWithList) y programas
# instalados con handler asociado (HKCR\Applications). Ver
# back_registro.rs. Su propia versión de windows-sys (misma franja
# ">=0.59, <=0.61" que ya usamos) trae las features de registro que
# necesita — no hace falta agregarlas a nuestro bloque windows-sys.
winreg = "0.56"

# Acceso al HWND real de una ventana (raw_window_handle::HasWindowHandle,
# que tauri::WebviewWindow ya implementa) — usado en back_menu_express.rs
# para aplicarle WS_EX_NOACTIVATE y que clickear sus botones no le quite
# el foco a la app activa. Misma versión (0.6) que usa Tauri 2.11 por dentro.
raw-window-handle = "0.6"

# Codificar los elementos tipo imagen del pool de Portapapeles como
# .png (etapa E, ver back_portapapeles.rs) a partir de los píxeles
# RGBA8 que ya entrega arboard/back_portapapeles_captura.rs. Se usa
# el crate png directo (encoder de bajo nivel) en vez del crate image
# completo: acá solo se ESCRIBE, nunca se decodifica un .png de
# vuelta a píxeles, así que no hace falta el resto de los formatos
# que trae image. Misma versión (0.18) que ya resuelve el árbol de
# dependencias por arboard.
png = "0.18"

windows-sys = {
    version = ">=0.59, <=0.61",
    features = [
        "Win32_Foundation",
        "Win32_System_DataExchange",
        "Win32_System_Diagnostics_ToolHelp",
        "Win32_System_LibraryLoader",
        "Win32_System_SystemInformation",
        "Win32_System_Threading",
        "Win32_UI_Input_KeyboardAndMouse",
        "Win32_UI_WindowsAndMessaging",
        "Win32_UI_Shell",
        "Win32_Graphics_Gdi",
        "Win32_UI_Accessibility",
    ]
}
